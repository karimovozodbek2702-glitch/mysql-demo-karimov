<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MySQL demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input { padding: 8px; width: 60%; }
    button { padding: 8px 14px; }
    li { margin: 6px 0; }
    small { color: #666; }
    #msg { min-height: 1.2em; color: #b00020; }
    #msg.ok { color: #1b7f3b; }
  </style>
</head>
<body>
  <h1>Ismingizni qoldiring</h1>
  <input id="name" placeholder="Ism" maxlength="100">
  <button onclick="add()">Saqlash</button>
  <p id="msg" role="status"></p>
  <ul id="list"></ul>

<script>
const API = "/.netlify/functions/api";

function showMsg(text, ok) {
  const m = document.getElementById("msg");
  m.textContent = text || "";
  m.className = ok ? "ok" : "";
}

function render(rows) {
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  rows.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r.name + " ";
    const s = document.createElement("small");
    s.textContent = "(" + new Date(r.created_at).toLocaleString() + ")";
    li.appendChild(s);
    ul.appendChild(li);
  });
}

async function load() {
  try {
    const res = await fetch(API);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Yuklab bo'lmadi");
    render(data);
  } catch (e) {
    showMsg("Ro'yxatni yuklab bo'lmadi: " + e.message);
  }
}

async function add() {
  const input = document.getElementById("name");
  const btn = document.querySelector("button");
  const name = input.value.trim();
  if (!name) { showMsg("Iltimos, ism kiriting"); return; }
  btn.disabled = true;
  showMsg("Saqlanmoqda...", true);
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Saqlab bo'lmadi");
    input.value = "";
    render(data);
    showMsg("Saqlandi!", true);
  } catch (e) {
    showMsg("Xatolik: " + e.message);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("name").addEventListener("keydown", e => {
  if (e.key === "Enter") add();
});

load();
</script>
</body>
</html>
